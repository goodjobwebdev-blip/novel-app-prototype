name: Fix issue 114

on:
  push:
    branches:
      - fix/issue-114-safe-document-flush

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-114-safe-document-flush
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: python .github/scripts/issue114.py
      - run: npm install --no-package-lock
      - run: node --test tests/keyed-async-queue.test.mjs tests/navigation-save-guard.test.mjs tests/async-state-guard.test.mjs tests/chat-selection-guard.test.mjs tests/tts-service-*.test.mjs
      - run: npm run build
      - name: Commit validated fix
        run: |
          rm .github/scripts/issue114.py .github/workflows/fix-issue-114.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add src/Workspace.tsx src/keyed-async-queue.ts tests/keyed-async-queue.test.mjs
          git commit -m "Fix overlapping document save races"
          git push origin HEAD:fix/issue-114-safe-document-flush
