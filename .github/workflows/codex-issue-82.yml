name: Codex issue 82 implementation

on:
  push:
    branches:
      - codex/issue-82-archive-codex

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-82-archive-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply archive implementation
        run: python .github/scripts/issue82.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build application
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue82.py .github/workflows/codex-issue-82.yml
          git add -A
          git commit -m "Implement Codex archive"
          git push origin HEAD:codex/issue-82-archive-codex
