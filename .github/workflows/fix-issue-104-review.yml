name: Fix issue 104 review

on:
  push:
    branches:
      - fix/issue-104-chat-stale-settings

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Validate issue 104 generation teardown hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-104-chat-stale-settings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply review hardening
        run: python .github/scripts/issue104_review.py
      - run: npm install --no-package-lock
      - run: node --test tests/async-state-guard.test.mjs tests/chat-selection-guard.test.mjs
      - run: node --test tests/tts-service-*.test.mjs
      - run: npm run build
      - name: Commit validated review hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue104_review.py .github/workflows/fix-issue-104-review.yml
          git add -A
          git commit -m "Harden Chat generation against stale teardown"
          git push origin HEAD:fix/issue-104-chat-stale-settings
