name: Validate issue 140 on latest main

on:
  push:
    branches:
      - fix/issue-140-chat-atomic-updates-work

permissions:
  contents: write

concurrency:
  group: issue-140-chat-atomic-updates-rebased
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-140-chat-atomic-updates-work
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Remove validation workflow
        run: |
          rm .github/workflows/issue-140-rebase-validation.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add -A
          git commit -m "Remove issue 140 rebase validation workflow"
          git push origin HEAD:fix/issue-140-chat-atomic-updates-work
