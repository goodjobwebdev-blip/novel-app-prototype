name: Fix issue 102

on:
  push:
    branches:
      - fix/issue-102-codex-trigger-stale-save

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-102-codex-trigger-stale-save
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: python .github/scripts/issue102.py
      - run: npm install --no-package-lock
      - run: node --test tests/async-state-guard.test.mjs
      - run: node --test tests/tts-service-*.test.mjs
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue102.py .github/workflows/fix-issue-102.yml
          git add -A
          git commit -m "Guard Codex trigger save against stale navigation"
          git push origin HEAD:fix/issue-102-codex-trigger-stale-save
