name: Chat outline tools integration

on:
  push:
    branches:
      - feature/chat-outline-tools

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-outline-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply outline tool patch
        run: node tools/apply-chat-outline-tools.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chat-service.ts src/persistence.ts src/ChatFeature.tsx src/Workspace.tsx src/chat.css src/chat-outline-tools.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add approved chat outline tools"
            git push origin HEAD:feature/chat-outline-tools
          fi
