name: Fix issue 117

on:
  push:
    branches:
      - fix/issue-117-codex-metadata-stale-state

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-117-codex-metadata-stale-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: python .github/scripts/issue117.py
      - run: npm install --no-package-lock
      - run: node --test tests/codex-metadata-selection-guard.test.mjs tests/async-state-guard.test.mjs tests/content-delete-active-subtree.test.mjs tests/navigation-save-guard.test.mjs tests/deletion-save-barrier.test.mjs tests/persistence-delete-write-guard.test.mjs tests/keyed-async-queue.test.mjs tests/chat-selection-guard.test.mjs tests/tts-service-*.test.mjs
      - run: npm run build
      - name: Commit validated fix
        run: |
          rm .github/scripts/issue117.py .github/workflows/fix-issue-117.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add -A
          git commit -m "Guard Codex metadata saves after navigation"
          git push origin HEAD:fix/issue-117-codex-metadata-stale-state
