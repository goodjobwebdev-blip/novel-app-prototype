name: Validate issue 130 book metadata ordering
on:
  push:
    branches: [fix/issue-130-book-metadata-ordering]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-130-book-metadata-ordering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 130 fix
        run: |
          python .github/scripts/issue130.py
          python .github/scripts/issue130_testfix.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm -f .github/scripts/issue130.py .github/scripts/issue130_testfix.py .github/workflows/issue-130-book-metadata.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name goodjobwebdev-blip
          git config user.email goodjob.webdev@gmail.com
          git commit -m "Order Book metadata saves by draft"
          git push origin HEAD:fix/issue-130-book-metadata-ordering
