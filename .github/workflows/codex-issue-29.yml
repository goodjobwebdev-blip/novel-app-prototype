name: Codex issue 29 implementation

on:
  push:
    branches:
      - codex/issue-29-effective-context-limits

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-29-effective-context-limits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Persist independent Story/Main and Codex context caps with safe migration.
          replace('src/ai-settings.ts',
          """  mainModel: string\n  mainModelContextLength?: number\n  supportModel: string\n  supportModelContextLength?: number\n  codexModel: string\n  codexModelContextLength?: number\n""",
          """  mainModel: string\n  mainModelContextLength?: number\n  mainEffectiveContextLimit: string\n  supportModel: string\n  supportModelContextLength?: number\n  codexModel: string\n  codexModelContextLength?: number\n  codexEffectiveContextLimit: string\n""")
          replace('src/ai-settings.ts',
          """  mainModel: '',\n  supportModel: '',\n  codexModel: '',\n  generationWordDelayMs: String(DEFAULT_GENERATION_WORD_DELAY_MS),\n""",
          """  mainModel: '',\n  mainEffectiveContextLimit: '',\n  supportModel: '',\n  codexModel: '',\n  codexEffectiveContextLimit: '',\n  generationWordDelayMs: String(DEFAULT_GENERATION_WORD_DELAY_MS),\n""")
          replace('src/ai-settings.ts',
          """    responseLength: typeof value?.responseLength === 'string' ? value.responseLength : '',\n    prompts,\n""",
          """    responseLength: typeof value?.responseLength === 'string' ? value.responseLength : '',\n    mainEffectiveContextLimit: typeof value?.mainEffectiveContextLimit === 'string' ? value.mainEffectiveContextLimit : '',\n    codexEffectiveContextLimit: typeof value?.codexEffectiveContextLimit === 'string' ? value.codexEffectiveContextLimit : '',\n    prompts,\n""")

          # Replace the old hard-window-only diagnostics with one shared effective-budget model.
          replace('src/context-service.ts',
          """export type ContextDiagnostics = { modelId: string; modelContextTokens: number; requestTokens: number; responseReserveTokens: number; fits: boolean }\n""",
          """export type ContextDiagnostics = {\n  modelId: string\n  modelContextTokens: number\n  modelContextKnown: boolean\n  configuredContextTokens?: number\n  effectiveContextTokens: number\n  usableInputTokens: number\n  requestTokens: number\n  responseReserveTokens: number\n  usageRatio: number\n  warning: boolean\n  fits: boolean\n  limitValid: boolean\n  limitError?: string\n  wasClamped: boolean\n}\n""")
          old_tail = """function modelContextLimit(modelId: string, catalogLimit?: number) {\n  if (Number.isFinite(catalogLimit) && Number(catalogLimit) >= 4_096) return Math.floor(Number(catalogLimit))\n  const explicit = [...modelId.toLowerCase().matchAll(/(?:^|[^\\d.])(\\d+(?:\\.\\d+)?)\\s*([km])(?:[^a-z]|$)/g)]\n    .map((match) => Number(match[1]) * (match[2] === 'm' ? 1_000_000 : 1_000)).filter((value) => Number.isFinite(value) && value >= 4_096).sort((a, b) => b - a)[0]\n  return explicit || 64_000\n}\n\nexport function generationContextDiagnostics(modelId: string, modelContextLength: number | undefined, systemPrompt: string, userMessage: string): ContextDiagnostics {\n  const modelContextTokens = modelContextLimit(modelId, modelContextLength)\n  const responseReserveTokens = Math.min(16_384, Math.max(2_048, Math.floor(modelContextTokens * .15)))\n  const requestTokens = tokenEstimate(`${systemPrompt}\\n\\n${userMessage}`) + 512\n  return { modelId, modelContextTokens, requestTokens, responseReserveTokens, fits: requestTokens + responseReserveTokens <= modelContextTokens }\n}\n"""
          new_tail = """function modelContextLimit(modelId: string, catalogLimit?: number) {\n  if (Number.isFinite(catalogLimit) && Number(catalogLimit) >= 4_096) return { tokens: Math.floor(Number(catalogLimit)), known: true }\n  const explicit = [...modelId.toLowerCase().matchAll(/(?:^|[^\\d.])(\\d+(?:\\.\\d+)?)\\s*([km])(?:[^a-z]|$)/g)]\n    .map((match) => Number(match[1]) * (match[2] === 'm' ? 1_000_000 : 1_000)).filter((value) => Number.isFinite(value) && value >= 4_096).sort((a, b) => b - a)[0]\n  if (explicit) return { tokens: explicit, known: true }\n  return { tokens: 64_000, known: false }\n}\n\nfunction configuredContextLimit(value: string | undefined) {\n  const input = String(value ?? '').trim().toLowerCase()\n  if (!input) return { valid: true as const, tokens: undefined }\n  const match = input.match(/^(\\d+(?:\\.\\d+)?)\\s*([km])?$/)\n  if (!match) return { valid: false as const, error: 'Enter a token count such as 32000, 32k, or 1m.' }\n  const multiplier = match[2] === 'm' ? 1_000_000 : match[2] === 'k' ? 1_000 : 1\n  const tokens = Math.floor(Number(match[1]) * multiplier)\n  if (!Number.isSafeInteger(tokens) || tokens < 4_096) return { valid: false as const, error: 'Context cap must be at least 4,096 tokens.' }\n  return { valid: true as const, tokens }\n}\n\nexport function contextLimitInputError(value: string | undefined) {\n  const parsed = configuredContextLimit(value)\n  return parsed.valid ? '' : parsed.error\n}\n\nexport function generationContextDiagnostics(modelId: string, modelContextLength: number | undefined, effectiveLimitInput: string | undefined, requestText: string): ContextDiagnostics {\n  const model = modelContextLimit(modelId, modelContextLength)\n  const configured = configuredContextLimit(effectiveLimitInput)\n  const configuredContextTokens = configured.valid ? configured.tokens : undefined\n  const effectiveContextTokens = configuredContextTokens === undefined\n    ? model.tokens\n    : model.known ? Math.min(configuredContextTokens, model.tokens) : configuredContextTokens\n  const responseReserveTokens = Math.min(16_384, Math.max(2_048, Math.floor(effectiveContextTokens * .15)))\n  const usableInputTokens = Math.max(0, effectiveContextTokens - responseReserveTokens)\n  const requestTokens = tokenEstimate(requestText) + 512\n  const usageRatio = usableInputTokens > 0 ? requestTokens / usableInputTokens : Number.POSITIVE_INFINITY\n  const limitValid = configured.valid\n  const fits = limitValid && requestTokens <= usableInputTokens\n  return {\n    modelId,\n    modelContextTokens: model.tokens,\n    modelContextKnown: model.known,\n    configuredContextTokens,\n    effectiveContextTokens,\n    usableInputTokens,\n    requestTokens,\n    responseReserveTokens,\n    usageRatio,\n    warning: limitValid && fits && usageRatio >= .85,\n    fits,\n    limitValid,\n    limitError: configured.valid ? undefined : configured.error,\n    wasClamped: Boolean(model.known && configuredContextTokens !== undefined && configuredContextTokens > model.tokens),\n  }\n}\n"""
          replace('src/context-service.ts', old_tail, new_tail)

          # Serialize the same NanoGPT message list that is actually sent, so diagnostics cannot drift.
          replace('src/nanogpt.ts',
          """export async function streamNanoGPTCompletion(\n  request: NanoGPTGenerationRequest,\n  onChunk: (text: string) => void,\n  signal: AbortSignal,\n  lifecycle: NanoGPTStreamLifecycle = {},\n) {\n  const storyPrompt = splitStoryPrompt(request.systemPrompt)\n  const messages = [{ role: 'system', content: storyPrompt?.systemPrompt ?? request.systemPrompt }]\n  if (storyPrompt?.bookContext.trim()) messages.push({ role: 'user', content: storyPrompt.bookContext })\n  if (request.contextMessage?.trim()) messages.push({ role: 'user', content: request.contextMessage })\n  if (storyPrompt?.sceneContext.trim()) messages.push({ role: 'user', content: storyPrompt.sceneContext })\n  if (request.userMessage?.trim()) messages.push({ role: 'user', content: request.userMessage })\n\n  const response = await fetch(completionEndpoint(request.baseUrl), {\n""",
          """export function nanoGPTCompletionMessages(request: Pick<NanoGPTGenerationRequest, 'systemPrompt' | 'contextMessage' | 'userMessage'>) {\n  const storyPrompt = splitStoryPrompt(request.systemPrompt)\n  const messages = [{ role: 'system', content: storyPrompt?.systemPrompt ?? request.systemPrompt }]\n  if (storyPrompt?.bookContext.trim()) messages.push({ role: 'user', content: storyPrompt.bookContext })\n  if (request.contextMessage?.trim()) messages.push({ role: 'user', content: request.contextMessage })\n  if (storyPrompt?.sceneContext.trim()) messages.push({ role: 'user', content: storyPrompt.sceneContext })\n  if (request.userMessage?.trim()) messages.push({ role: 'user', content: request.userMessage })\n  return messages\n}\n\nexport function nanoGPTRequestText(request: Pick<NanoGPTGenerationRequest, 'systemPrompt' | 'contextMessage' | 'userMessage'>) {\n  return JSON.stringify({ messages: nanoGPTCompletionMessages(request) })\n}\n\nexport async function streamNanoGPTCompletion(\n  request: NanoGPTGenerationRequest,\n  onChunk: (text: string) => void,\n  signal: AbortSignal,\n  lifecycle: NanoGPTStreamLifecycle = {},\n) {\n  const messages = nanoGPTCompletionMessages(request)\n\n  const response = await fetch(completionEndpoint(request.baseUrl), {\n""")

          # Shared Chat request contract: visible workspace instructions, tool definitions, exact diagnostic serialization.
          Path('src/chat-request.ts').write_text("""import type { ChatCompletionMessage } from './chat-api'\nimport { chatWorkspaceTools } from './chat-tools'\nimport { chatEntityTools } from './chat-entity-tools'\nimport { chatOutlineTools } from './chat-outline-tools'\n\nexport const CHAT_WORKSPACE_INSTRUCTIONS = `# Workspace tools\n\nYou can inspect and propose edits to Scenes, Notes, and Codex entries in this book. You can propose creating Notes and Codex entries, renaming or deleting Notes/Codex entries, and changing a Codex category. For the outline, use read_outline before structural changes; you may propose creating, renaming, moving/reordering, or deleting Acts, Chapters, and Scenes, and a newly created Scene may include initial Markdown content. Mutating tools only create approval proposals: never claim an edit, creation, rename, move, reorder, category change, or deletion happened until the user approves the card in Chat. Outline deletion is allowed only when the target and every descendant Scene have empty content. Search/read tools are read-only and can run automatically. Use search_entities and read_entity when a document target is not already known. For localized document changes, prefer propose_document_edit with exact old_text copied from read_entity. Use propose_document_replacement only for whole-document rewrites.`\n\nexport const CHAT_TOOL_DEFINITIONS = [...chatWorkspaceTools, ...chatEntityTools, ...chatOutlineTools]\n\nexport function serializeChatModelInput(messages: ChatCompletionMessage[]) {\n  return JSON.stringify({ messages, tools: CHAT_TOOL_DEFINITIONS })\n}\n""")

          # Persist an independent cap on each Chat, copied from the book Main model settings.
          replace('src/chat-service.ts',
          """  model: string\n  modelContextLength?: number\n  systemPrompt: string\n""",
          """  model: string\n  modelContextLength?: number\n  effectiveContextLimit: string\n  systemPrompt: string\n""")
          replace('src/chat-service.ts',
          """export async function getChat(chatId: string): Promise<ChatEntity | undefined> {\n  const entity = await getEntity<ArcEntity>(chatId)\n  if (entity?.type !== 'chat') return undefined\n  const chat = entity as ChatEntity\n  if (!previousDefaultAssistantPrompts.some((prompt) => prompt === chat.systemPrompt)) return chat\n  const migrated: ChatEntity = { ...chat, systemPrompt: defaultAiPrompts.assistant }\n  await putEntity(migrated)\n  return migrated\n}\n""",
          """export async function getChat(chatId: string): Promise<ChatEntity | undefined> {\n  const entity = await getEntity<ArcEntity>(chatId)\n  if (entity?.type !== 'chat') return undefined\n  const chat = entity as ChatEntity\n  const promptNeedsMigration = previousDefaultAssistantPrompts.some((prompt) => prompt === chat.systemPrompt)\n  const limitNeedsMigration = typeof chat.effectiveContextLimit !== 'string'\n  if (!promptNeedsMigration && !limitNeedsMigration) return chat\n  const migrated: ChatEntity = {\n    ...chat,\n    systemPrompt: promptNeedsMigration ? defaultAiPrompts.assistant : chat.systemPrompt,\n    effectiveContextLimit: limitNeedsMigration ? '' : chat.effectiveContextLimit,\n  }\n  await putEntity(migrated)\n  return migrated\n}\n""")
          replace('src/chat-service.ts',
          """    model: settings.mainModel,\n    modelContextLength: settings.mainModelContextLength,\n    systemPrompt: settings.prompts.assistant,\n""",
          """    model: settings.mainModel,\n    modelContextLength: settings.mainModelContextLength,\n    effectiveContextLimit: settings.mainEffectiveContextLimit,\n    systemPrompt: settings.prompts.assistant,\n""")
          replace('src/chat-service.ts',
          """export async function updateChat(chatId: string, patch: Partial<Pick<ChatEntity, 'title' | 'model' | 'modelContextLength' | 'systemPrompt' | 'thinking' | 'contextProfile' | 'lastMessagePreview'>>): Promise<ChatEntity> {\n""",
          """export async function updateChat(chatId: string, patch: Partial<Pick<ChatEntity, 'title' | 'model' | 'modelContextLength' | 'effectiveContextLimit' | 'systemPrompt' | 'thinking' | 'contextProfile' | 'lastMessagePreview'>>): Promise<ChatEntity> {\n""")

          # Story/Codex preflight uses exact provider message serialization and the selected path's cap.
          replace('src/Workspace.tsx',
          """import { fetchNanoGPTModelContextLength, renderLorePrompt, renderStoryPrompt, streamNanoGPTCompletion, type NanoGPTStreamMetadata } from './nanogpt'\n""",
          """import { fetchNanoGPTModelContextLength, nanoGPTRequestText, renderLorePrompt, renderStoryPrompt, streamNanoGPTCompletion, type NanoGPTStreamMetadata } from './nanogpt'\n""")
          replace('src/Workspace.tsx',
          """        const diagnostics = generationContextDiagnostics(selectedModel, modelContextLength, systemPrompt, `${contextMessage}\\n\\n${userMessage}`)\n        if (!diagnostics.fits) {\n          editor.finishGeneration('error')\n          showToast(`Context is too large: ~${diagnostics.requestTokens.toLocaleString()} tokens plus response space for a ${diagnostics.modelContextTokens.toLocaleString()}-token model. Reduce context or choose a larger model.`)\n          return\n        }\n""",
          """        const effectiveLimit = isCodex && settings.codexModel.trim() ? settings.codexEffectiveContextLimit : settings.mainEffectiveContextLimit\n        const requestText = nanoGPTRequestText({ systemPrompt, contextMessage, userMessage })\n        const diagnostics = generationContextDiagnostics(selectedModel, modelContextLength, effectiveLimit, requestText)\n        if (!diagnostics.limitValid) {\n          editor.finishGeneration('error')\n          showToast(diagnostics.limitError ?? 'The effective context cap is invalid. Check Book AI settings.')\n          return\n        }\n        if (!diagnostics.fits) {\n          editor.finishGeneration('error')\n          showToast(`Context is too large: ~${diagnostics.requestTokens.toLocaleString()} input tokens for a ${diagnostics.usableInputTokens.toLocaleString()}-token usable budget (${diagnostics.effectiveContextTokens.toLocaleString()} effective limit, ${diagnostics.responseReserveTokens.toLocaleString()} reserved for the response). Deselect context, summarize older material, raise the cap, or choose a larger model.`)\n          return\n        }\n        if (diagnostics.warning) {\n          showToast(`Context is near the configured limit (${Math.round(diagnostics.usageRatio * 100)}%). Consider summarizing older material, deselecting full-text context, or raising the cap before adding more context.`)\n        }\n""")

          # Chat uses the same estimator, includes tool schemas, rechecks after tool rounds, and exposes a per-chat cap.
          replace('src/ChatFeature.tsx',
          """import { buildContextValues, generationContextDiagnostics } from './context-service'\n""",
          """import { buildContextValues, contextLimitInputError, generationContextDiagnostics } from './context-service'\n""")
          replace('src/ChatFeature.tsx',
          """import { applyChatOutlineAction, chatOutlineToolNames, chatOutlineTools, executeChatOutlineTool, rejectChatOutlineAction } from './chat-outline-tools'\n""",
          """import { applyChatOutlineAction, chatOutlineToolNames, executeChatOutlineTool, rejectChatOutlineAction } from './chat-outline-tools'\nimport { CHAT_TOOL_DEFINITIONS, CHAT_WORKSPACE_INSTRUCTIONS, serializeChatModelInput } from './chat-request'\n""")
          replace('src/ChatFeature.tsx',
          """  const [promptDraft, setPromptDraft] = useState('')\n""",
          """  const [promptDraft, setPromptDraft] = useState('')\n  const [limitDraft, setLimitDraft] = useState('')\n""")
          replace('src/ChatFeature.tsx',
          """        setChat(loadedChat)\n        setPromptDraft(loadedChat.systemPrompt)\n        setMessages(loadedMessages)\n""",
          """        setChat(loadedChat)\n        setPromptDraft(loadedChat.systemPrompt)\n        setLimitDraft(loadedChat.effectiveContextLimit)\n        setMessages(loadedMessages)\n""")
          replace('src/ChatFeature.tsx',
          """  async function savePrompt() {\n""",
          """  async function saveEffectiveContextLimit() {\n    if (!chat || limitDraft === chat.effectiveContextLimit) return\n    const error = contextLimitInputError(limitDraft)\n    if (error) { onToast(error); return }\n    try {\n      const updated = await updateChat(chat.id, { effectiveContextLimit: limitDraft })\n      setChat(updated)\n      setLimitDraft(updated.effectiveContextLimit)\n    } catch (error) {\n      onToast(error instanceof Error ? error.message : 'Could not save the Chat context cap.')\n    }\n  }\n\n  async function savePrompt() {\n""")
          replace('src/ChatFeature.tsx',
          """    const workspaceInstructions = `# Workspace tools\n\nYou can inspect and propose edits to Scenes, Notes, and Codex entries in this book. You can propose creating Notes and Codex entries, renaming or deleting Notes/Codex entries, and changing a Codex category. For the outline, use read_outline before structural changes; you may propose creating, renaming, moving/reordering, or deleting Acts, Chapters, and Scenes, and a newly created Scene may include initial Markdown content. Mutating tools only create approval proposals: never claim an edit, creation, rename, move, reorder, category change, or deletion happened until the user approves the card in Chat. Outline deletion is allowed only when the target and every descendant Scene have empty content. Search/read tools are read-only and can run automatically. Use search_entities and read_entity when a document target is not already known. For localized document changes, prefer propose_document_edit with exact old_text copied from read_entity. Use propose_document_replacement only for whole-document rewrites.`\n""",
          """    const workspaceInstructions = CHAT_WORKSPACE_INSTRUCTIONS\n""")
          replace('src/ChatFeature.tsx',
          """    const requestText = providerMessages.map((message) => `${message.role}: ${message.content ?? ''}${message.reasoning_content ? `\\nreasoning: ${message.reasoning_content}` : ''}`).join('\\n\\n')\n    const diagnostics = generationContextDiagnostics(activeChat.model, activeChat.modelContextLength, systemPrompt, requestText)\n    if (!diagnostics.fits) {\n      onToast(`Context is too large for this model (~${diagnostics.requestTokens.toLocaleString()} request tokens plus response space). Reduce Chat context in Context Management or choose a larger model.`)\n      return\n    }\n\n    const controller = new AbortController()\n""",
          """    const diagnostics = generationContextDiagnostics(activeChat.model, activeChat.modelContextLength, activeChat.effectiveContextLimit, serializeChatModelInput(providerMessages))\n    if (!diagnostics.limitValid) {\n      onToast(diagnostics.limitError ?? 'The Chat context cap is invalid.')\n      return\n    }\n    if (!diagnostics.fits) {\n      onToast(`Context is too large: ~${diagnostics.requestTokens.toLocaleString()} input tokens for a ${diagnostics.usableInputTokens.toLocaleString()}-token usable Chat budget (${diagnostics.effectiveContextTokens.toLocaleString()} effective limit, ${diagnostics.responseReserveTokens.toLocaleString()} reserved for the response). Reduce Chat context, summarize older material, raise the cap, or choose a larger model.`)\n      return\n    }\n    if (diagnostics.warning) onToast(`Chat context is near the configured limit (${Math.round(diagnostics.usageRatio * 100)}%). Consider reducing selected context or raising the cap.`)\n\n    const controller = new AbortController()\n""")
          replace('src/ChatFeature.tsx',
          """      for (let round = 0; round < 8 && !controller.signal.aborted; round += 1) {\n        activeRoundContent = ''\n""",
          """      for (let round = 0; round < 8 && !controller.signal.aborted; round += 1) {\n        const roundDiagnostics = generationContextDiagnostics(activeChat.model, activeChat.modelContextLength, activeChat.effectiveContextLimit, serializeChatModelInput(workingMessages))\n        if (!roundDiagnostics.limitValid) throw new Error(roundDiagnostics.limitError ?? 'The Chat context cap is invalid.')\n        if (!roundDiagnostics.fits) throw new Error(`Chat context exceeded its usable budget after workspace tool results (~${roundDiagnostics.requestTokens.toLocaleString()} / ${roundDiagnostics.usableInputTokens.toLocaleString()} input tokens). Reduce context or raise the cap; Arc will not remove older turns automatically.`)\n        activeRoundContent = ''\n""")
          replace('src/ChatFeature.tsx',
          """          tools: [...chatWorkspaceTools, ...chatEntityTools, ...chatOutlineTools],\n""",
          """          tools: CHAT_TOOL_DEFINITIONS,\n""")
          replace('src/ChatFeature.tsx',
          """      <div className=\"chat-config-row\">\n        <ChatModelPicker value={chat.model} models={sortedModels} onChange={(modelId) => { void changeModel(modelId) }} />\n        <button className=\"chat-system-prompt-button\" type=\"button\" onClick={() => { setPromptDraft(chat.systemPrompt); setPromptOpen(true) }}><Bot aria-hidden=\"true\" /><span>System prompt</span></button>\n        {modelStatus && <small className=\"chat-model-status\">{modelStatus}</small>}\n      </div>\n""",
          """      <div className=\"chat-config-row\">\n        <ChatModelPicker value={chat.model} models={sortedModels} onChange={(modelId) => { void changeModel(modelId) }} />\n        <label className={`chat-context-limit ${contextLimitInputError(limitDraft) ? 'invalid' : ''}`}><span>Context cap</span><input value={limitDraft} onChange={(event) => setLimitDraft(event.target.value)} onBlur={() => { void saveEffectiveContextLimit() }} onKeyDown={(event) => { if (event.key === 'Enter') event.currentTarget.blur() }} placeholder=\"Model max\" inputMode=\"text\" aria-label=\"Chat effective context cap\" /><small>{contextLimitInputError(limitDraft) || 'Empty uses the model maximum. 32k / 1m supported.'}</small></label>\n        <button className=\"chat-system-prompt-button\" type=\"button\" onClick={() => { setPromptDraft(chat.systemPrompt); setPromptOpen(true) }}><Bot aria-hidden=\"true\" /><span>System prompt</span></button>\n        {modelStatus && <small className=\"chat-model-status\">{modelStatus}</small>}\n      </div>\n""")

          # Remove now-unused direct tool-array imports from ChatFeature.
          replace('src/ChatFeature.tsx',
          """import { applyChatDocumentEdit, chatWorkspaceTools, createChatCodexEntry, executeChatWorkspaceTool, rejectChatCodexEntry, rejectChatDocumentEdit } from './chat-tools'\n""",
          """import { applyChatDocumentEdit, createChatCodexEntry, executeChatWorkspaceTool, rejectChatCodexEntry, rejectChatDocumentEdit } from './chat-tools'\n""")
          replace('src/ChatFeature.tsx',
          """import { applyChatEntityAction, chatEntityToolNames, chatEntityTools, executeChatEntityTool, rejectChatEntityAction } from './chat-entity-tools'\n""",
          """import { applyChatEntityAction, chatEntityToolNames, executeChatEntityTool, rejectChatEntityAction } from './chat-entity-tools'\n""")

          # AI settings UI and Context Management preview expose/diagnose the effective cap.
          replace('src/App.tsx',
          """import { buildContextValues, type PreparedContextValues } from './context-service'\n""",
          """import { buildContextValues, contextLimitInputError, generationContextDiagnostics, type PreparedContextValues } from './context-service'\n""")
          replace('src/App.tsx',
          """import { getChat, listChatMessages, saveChatContextProfile, type ChatEntity, type ChatMessageEntity } from './chat-service'\n""",
          """import { getChat, listChatMessages, saveChatContextProfile, type ChatEntity, type ChatMessageEntity } from './chat-service'\nimport { CHAT_TOOL_DEFINITIONS, CHAT_WORKSPACE_INSTRUCTIONS, serializeChatModelInput } from './chat-request'\n""")
          replace('src/App.tsx',
          """const chatWorkspaceInstructions = `# Workspace tools\n\nYou can inspect and propose edits to Scenes, Notes, and Codex entries in this book. You can also propose creating a new Codex/lore entry. For the outline, use read_outline before structural changes; you may propose creating, renaming, moving/reordering, or deleting Acts, Chapters, and Scenes. Mutating tools only create approval proposals: never claim an edit, creation, rename, move, reorder, or deletion happened until the user approves the card in Chat. Outline deletion is allowed only when the target and every descendant Scene have empty content. Search/read tools are read-only and can run automatically. Use search_entities and read_entity when a document target is not already known. For localized document changes, prefer propose_document_edit with exact old_text copied from read_entity. Use propose_document_replacement only for whole-document rewrites.`\n\n""",
          """")
          replace('src/App.tsx',
          """  const outlineState = message.role === 'assistant' && message.outlineActions?.length\n    ? `\\n\\n[Outline proposals: ${message.outlineActions.map((proposal) => `${proposal.action} ${proposal.entityTitle}: ${proposal.status}`).join('; ')}]`\n    : ''\n  return `${message.content}${editState}${creationState}${outlineState}`\n""",
          """  const outlineState = message.role === 'assistant' && message.outlineActions?.length\n    ? `\\n\\n[Outline proposals: ${message.outlineActions.map((proposal) => `${proposal.action} ${proposal.entityTitle}: ${proposal.status}`).join('; ')}]`\n    : ''\n  const entityActionState = message.role === 'assistant' && message.entityActions?.length\n    ? `\\n\\n[Note/Codex proposals: ${message.entityActions.map((proposal) => `${proposal.action} ${proposal.entityTitle}: ${proposal.status}`).join('; ')}]`\n    : ''\n  return `${message.content}${editState}${creationState}${outlineState}${entityActionState}`\n""")
          replace('src/App.tsx',
          """          <div className=\"response-length-setting\">\n""",
          """          <div className=\"context-limit-grid\">\n            <label className={contextLimitInputError(settings.mainEffectiveContextLimit) ? 'invalid' : ''}><span><strong>Story / Main context cap</strong><em>Effective input window</em></span><input type=\"text\" value={settings.mainEffectiveContextLimit} onChange={(event) => update('mainEffectiveContextLimit', event.target.value)} placeholder=\"Model maximum\" spellCheck={false} /><small>{contextLimitInputError(settings.mainEffectiveContextLimit) || 'Optional. Accepts tokens such as 32000, 32k, or 1m. The model hard maximum still wins.'}</small></label>\n            <label className={contextLimitInputError(settings.codexEffectiveContextLimit) ? 'invalid' : ''}><span><strong>Codex model context cap</strong><em>Used when a Codex model is set</em></span><input type=\"text\" value={settings.codexEffectiveContextLimit} onChange={(event) => update('codexEffectiveContextLimit', event.target.value)} placeholder=\"Model maximum\" spellCheck={false} /><small>{contextLimitInputError(settings.codexEffectiveContextLimit) || (settings.codexModel.trim() ? 'Optional cap for the selected Codex model.' : 'Codex currently falls back to Main, so the Story / Main cap applies.')}</small></label>\n          </div>\n          <div className=\"response-length-setting\">\n""")
          replace('src/App.tsx',
          """    requestMessages.push({ key: 'chat-workspace', role: 'system', title: 'Workspace instructions', detail: 'SYSTEM', content: chatWorkspaceInstructions })\n""",
