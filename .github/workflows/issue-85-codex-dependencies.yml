name: Validate issue 85 Codex dependencies
on:
  push:
    branches: [feat/issue-85-codex-dependencies]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-85-codex-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 85
        run: python .github/scripts/issue85.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm -f .github/scripts/issue85.py .github/workflows/issue-85-codex-dependencies.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name goodjobwebdev-blip
          git config user.email goodjob.webdev@gmail.com
          git commit -m "Add explicit Codex dependencies"
          git push origin HEAD:feat/issue-85-codex-dependencies
