name: Codex issue 79 review

on:
  push:
    branches:
      - codex/issue-79-tts

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-79-tts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply review fix
        run: python .github/scripts/issue79_review.py
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Commit validated review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue79_review.py .github/workflows/codex-issue-79-review.yml
          git add -A
          git commit -m "Distinguish TTS terminal states"
          git push origin HEAD:codex/issue-79-tts
