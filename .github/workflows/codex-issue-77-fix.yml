name: Codex issue 77 corrected implementation

on:
  push:
    branches:
      - codex/issue-77-codex-summaries

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-77-codex-summaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply corrected Codex summary implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/scripts/issue77.py').read_text()
          start_marker = "replace(\n    'src/context-service.ts',\n    \"\"\"    additionalContext:"
          start = source.index(start_marker, source.index('const selectedCodex'))
          end = source.index("\n\n# Context Management request preview", start)
          corrected = """replace(\n    'src/context-service.ts',\n    \"    additionalContext: [...fullSections\",\n    \"    codexRepresentations,\\n    additionalContext: [...fullSections\",\n)"""
          source = source[:start] + corrected + source[end:]
          exec(compile(source, 'issue77.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build application
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue77.py .github/workflows/codex-issue-77-fix.yml
          git add -A
          git commit -m "Implement Codex summaries"
          git push origin HEAD:codex/issue-77-codex-summaries
