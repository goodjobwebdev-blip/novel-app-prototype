name: Validate issue 86 dependency cascade
on:
  push:
    branches: [feat/issue-86-codex-dependency-cascade]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-86-codex-dependency-cascade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 86
        run: |
          python .github/scripts/issue86.py
          python .github/scripts/issue86-fix.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm -f .github/scripts/issue86.py .github/scripts/issue86-fix.py .github/workflows/issue-86-codex-dependency-cascade.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name goodjobwebdev-blip
          git config user.email goodjob.webdev@gmail.com
          git commit -m "Cascade automatic Codex dependencies"
          git push origin HEAD:feat/issue-86-codex-dependency-cascade
