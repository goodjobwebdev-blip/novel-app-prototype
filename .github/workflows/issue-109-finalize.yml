name: Validate and finalize issue 109

on:
  push:
    branches: [feat/issue-109-fake-provider]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-109-fake-provider
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply final focused fixes
        run: node scripts/finalize-issue-109.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: validate deterministic Fake provider"
          git push origin HEAD:feat/issue-109-fake-provider
