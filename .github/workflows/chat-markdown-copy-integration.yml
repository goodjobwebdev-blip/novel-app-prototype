name: Chat Markdown and copy integration

on:
  push:
    branches:
      - feature/chat-markdown-copy

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-markdown-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply chat Markdown/copy patch
        run: node tools/apply-chat-markdown-copy.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/ChatFeature.tsx src/chat.css
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Render chat Markdown and add copy actions"
            git push origin HEAD:feature/chat-markdown-copy
          fi
