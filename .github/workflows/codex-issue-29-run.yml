name: Codex issue 29 corrected runner

on:
  push:
    branches:
      - codex/issue-29-effective-context-limits

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-29-effective-context-limits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply corrected focused implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/codex-issue-29.yml').read_text()
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          marker = script.index('const chatWorkspaceInstructions')
          malformed = script.index('""")', marker)
          script = script[:malformed] + "'')" + script[malformed + 4:]
          exec(compile(script, 'issue29_patch', 'exec'))
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build application
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/codex-issue-29.yml .github/workflows/codex-issue-29-run.yml
          git add -A
          git commit -m "Implement effective context limits"
          git push origin HEAD:codex/issue-29-effective-context-limits
