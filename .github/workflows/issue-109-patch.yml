name: Apply issue 109 branch patch

on:
  push:
    branches: [feat/issue-109-fake-provider]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-109-fake-provider
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply focused source edits
        run: |
          sed -i "s/'cachedTextModelCatalog(defaults)', 3)/'cachedTextModelCatalog(defaults)', 2)/" scripts/apply-issue-109.mjs
          sed -i "s/'cachedTextModelCatalog(copied)', 2)/'cachedTextModelCatalog(copied)', 1)/" scripts/apply-issue-109.mjs
          node scripts/apply-issue-109.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate deterministic Fake testing provider"
          git push origin HEAD:feat/issue-109-fake-provider
