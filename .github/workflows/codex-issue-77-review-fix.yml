name: Codex issue 77 review fix

on:
  push:
    branches:
      - codex/issue-77-codex-summaries
    paths:
      - .github/workflows/codex-issue-77-review-fix.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-77-codex-summaries
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply review fix
        run: python .github/scripts/issue77-review-fix.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build application
        run: npm run build
      - name: Remove helper files and commit validated fix
        run: |
          rm .github/scripts/issue77-review-fix.py .github/workflows/codex-issue-77-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve legacy Codex summary freshness"
          git push origin HEAD:codex/issue-77-codex-summaries
