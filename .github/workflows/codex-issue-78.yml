name: Codex issue 78 implementation

on:
  push:
    branches:
      - codex/issue-78-autotitle

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-78-autotitle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 78 implementation
        run: |
          python .github/scripts/issue78.py
          python .github/scripts/issue78_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build application
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/issue78.py .github/scripts/issue78_fix.py .github/workflows/codex-issue-78.yml .github/issue78-trigger.txt
          git add -A
          git commit -m "Implement direct autotitle generation"
          git push origin HEAD:codex/issue-78-autotitle
