name: Validate issue 138 summary generation ownership

on:
  push:
    branches:
      - fix/issue-138-summary-generation-owner

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-138-summary-generation-owner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 138 fix
        run: python .github/scripts/issue138.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm .github/scripts/issue138.py .github/workflows/issue-138-summary-owner.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add -A
          git commit -m "Fix Summary generation ownership"
          git push origin HEAD:fix/issue-138-summary-generation-owner
