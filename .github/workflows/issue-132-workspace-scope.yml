name: Validate issue 132 workspace book scope

on:
  push:
    branches:
      - fix/issue-132-workspace-book-scope

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-132-workspace-book-scope
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 132 fix
        run: python .github/scripts/issue132.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm .github/scripts/issue132.py .github/workflows/issue-132-workspace-scope.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add -A
          git commit -m "Guard workspace state by active book"
          git push origin HEAD:fix/issue-132-workspace-book-scope
