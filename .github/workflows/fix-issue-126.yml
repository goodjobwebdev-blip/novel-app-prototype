name: Fix issue 126

on:
  push:
    branches:
      - fix/issue-126-fork-proposal-authority

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-126-fork-proposal-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: python .github/scripts/issue126.py
      - run: npm install --no-package-lock
      - run: node --test tests/chat-fork-proposals.test.mjs tests/chat-history-guard.test.mjs tests/chat-proposal-transition.test.mjs tests/chat-proposal-target.test.mjs tests/chat-codex-duplicate.test.mjs tests/editor-unmount-guard.test.mjs tests/navigation-save-guard.test.mjs tests/deletion-save-barrier.test.mjs tests/persistence-delete-write-guard.test.mjs tests/keyed-async-queue.test.mjs tests/async-state-guard.test.mjs tests/chat-selection-guard.test.mjs tests/tts-service-*.test.mjs
      - run: npm run build
      - name: Commit validated fix
        run: |
          rm .github/scripts/issue126.py .github/workflows/fix-issue-126.yml
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git add -A
          git commit -m "Make forked Chat proposals historical and non-actionable"
          git push origin HEAD:fix/issue-126-fork-proposal-authority
