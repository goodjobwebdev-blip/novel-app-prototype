name: Validate issue 87 request composition foundation
on:
  push:
    branches: [feat/issue-87-request-composition-foundation-v2]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-87-request-composition-foundation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply issue 87 foundation
        run: |
          python .github/scripts/issue87_v2.py
          python .github/scripts/issue87_testfix.py
          python .github/scripts/issue87_buildfix.py
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Commit validated source
        run: |
          rm -f .github/scripts/issue87_v2.py .github/scripts/issue87_testfix.py .github/scripts/issue87_buildfix.py .github/workflows/issue-87-request-composition-v2.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name goodjobwebdev-blip
          git config user.email goodjob.webdev@gmail.com
          git commit -m "Add request composition foundation"
          git push origin HEAD:feat/issue-87-request-composition-foundation-v2
