name: Validate issue 134 against latest main

on:
  push:
    branches:
      - fix/issue-134-chat-generation-handoff

permissions:
  contents: write

concurrency:
  group: issue-134-sync-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-134-chat-generation-handoff
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "goodjobwebdev-blip"
          git config user.email "goodjob.webdev@gmail.com"
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated latest-main integration
        run: |
          rm .github/workflows/issue-134-sync-validation.yml
          git add -A
          git commit -m "Remove issue 134 sync validation workflow"
          git push origin HEAD:fix/issue-134-chat-generation-handoff
